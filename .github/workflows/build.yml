name: Build SkyNCar
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Android SDK packages
        run: python3 scripts/setup_sdk.py
        env:
          ANDROID_HOME: ${{ runner.temp }}/skyncar-sdk
      - name: Build and verify APK
        run: sh build.sh
        env:
          ANDROID_HOME: ${{ runner.temp }}/skyncar-sdk
      - name: Test greeting and maintenance
        run: node --test tests/core.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: SkyNCar-debug
          path: build/SkyNCar.apk
